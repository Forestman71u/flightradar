<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Flight Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQpDPY17hD4RtxdCcD3XtT6ZWuZ7nXw=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    :root { --bg:#0b1220; --panel:#101b2f; --panel2:#17243b; --text:#eef6ff; --muted:#a8b6cb; --accent:#4cc9f0; --danger:#ff6b6b; --ok:#6ee7b7; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: Arial, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    body { overflow: hidden; }
    #app { height: 100vh; width: 100vw; display: grid; grid-template-rows: auto 1fr; }
    header { z-index: 1000; background: rgba(11,18,32,.94); border-bottom: 1px solid rgba(255,255,255,.10); padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
    .status { margin-top: 8px; color: var(--muted); font-size: 14px; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button, select { border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 14px; }
    button { background: var(--accent); color: #06111f; cursor: pointer; }
    button.secondary { background: white; color: #0b1220; }
    select { background: white; min-width: 135px; color: #0b1220; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .chip { background: var(--panel2); border: 1px solid rgba(255,255,255,.10); color: var(--muted); border-radius: 999px; padding: 8px 10px; font-size: 13px; }
    #map { height: 100%; width: 100%; min-height: 0; background: #162033; }
    .plane-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #fff; border: 2px solid #111827; box-shadow: 0 2px 8px rgba(0,0,0,.35); font-size: 17px; transform-origin: center; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #101b2f; color: var(--text); }
    .popup-title { font-weight: 800; font-size: 15px; margin-bottom: 6px; }
    .popup-row { color: var(--muted); margin: 2px 0; }
    .help { position: absolute; left: 14px; bottom: 14px; z-index: 1000; max-width: 520px; background: rgba(11,18,32,.90); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 10px 12px; color: var(--muted); font-size: 13px; line-height: 1.35; }
    @media (max-width: 650px) { body { overflow: auto; } #app { height: 100dvh; } header { padding: 12px; } .controls > * { flex: 1 1 45%; } .help { display: none; } }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="top"><h1>Personal Flight Radar</h1></div>
      <div id="status" class="status">Click “Use My Location” to load nearby aircraft.</div>
      <div class="controls">
        <button id="locBtn">Use My Location</button>
        <button id="refreshBtn" class="secondary">Refresh</button>
        <button id="autoBtn" class="secondary">Auto Refresh: Off</button>
        <select id="radius">
          <option value="25">25 miles</option>
          <option value="50" selected>50 miles</option>
          <option value="100">100 miles</option>
          <option value="150">150 miles</option>
        </select>
      </div>
      <div class="chips">
        <span class="chip" id="countChip">Aircraft: 0</span>
        <span class="chip" id="updatedChip">Last updated: Never</span>
        <span class="chip" id="sourceChip">Source: ADSB.lol + OpenSky fallback</span>
      </div>
    </header>
    <div id="map"></div>
  </div>
  <div class="help">Free ADS-B data can be delayed, incomplete, or rate-limited. For hobby/educational use only — not for navigation or safety-critical decisions.</div>

<script>
const defaultLocation = { lat: 40.7608, lon: -111.8910 }; // SLC fallback
let current = {...defaultLocation};
let map, userMarker, aircraftLayer, autoTimer = null;

const statusEl = document.getElementById('status');
const countChip = document.getElementById('countChip');
const updatedChip = document.getElementById('updatedChip');

function setStatus(msg, type='') { statusEl.textContent = msg; statusEl.className = 'status ' + type; }
function milesToKm(miles) { return miles * 1.60934; }
function fmt(v, unit='') { return (v === undefined || v === null || v === '') ? 'n/a' : `${v}${unit}`; }

function initMap() {
  map = L.map('map', { zoomControl: true }).setView([current.lat, current.lon], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  aircraftLayer = L.layerGroup().addTo(map);
  userMarker = L.circleMarker([current.lat, current.lon], { radius: 8, color: '#4cc9f0', fillColor: '#4cc9f0', fillOpacity: .8 }).addTo(map).bindPopup('Your location');
  setTimeout(() => map.invalidateSize(), 250);
}

function planeMarker(ac) {
  const heading = Number(ac.track ?? ac.heading ?? 0);
  const icon = L.divIcon({ className: '', html: `<div class="plane-icon" style="transform: rotate(${heading}deg)">✈</div>`, iconSize: [28,28], iconAnchor: [14,14] });
  const callsign = (ac.flight || ac.callsign || ac.hex || ac.icao24 || 'Unknown').trim?.() || 'Unknown';
  const altitude = ac.alt_baro || ac.baro_altitude || ac.altitude;
  const speed = ac.gs || ac.velocity || ac.speed;
  return L.marker([ac.lat, ac.lon], { icon }).bindPopup(`
    <div class="popup-title">${callsign}</div>
    <div class="popup-row">Hex: ${fmt(ac.hex || ac.icao24)}</div>
    <div class="popup-row">Altitude: ${fmt(altitude, ' ft')}</div>
    <div class="popup-row">Speed: ${fmt(Math.round(speed || 0), ac.velocity ? ' m/s' : ' kt')}</div>
    <div class="popup-row">Heading: ${fmt(Math.round(heading), '°')}</div>
  `);
}

async function fetchAdsbLol(lat, lon, radiusMiles) {
  const km = Math.round(milesToKm(radiusMiles));
  const url = `https://api.adsb.lol/v2/lat/${lat}/lon/${lon}/dist/${km}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('ADSB.lol request failed');
  const data = await res.json();
  return (data.ac || []).filter(a => a.lat && a.lon);
}

async function fetchOpenSky(lat, lon, radiusMiles) {
  const deg = radiusMiles / 69;
  const lamin = lat - deg, lamax = lat + deg, lomin = lon - deg, lomax = lon + deg;
  const url = `https://opensky-network.org/api/states/all?lamin=${lamin}&lomin=${lomin}&lamax=${lamax}&lomax=${lomax}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('OpenSky request failed');
  const data = await res.json();
  return (data.states || []).map(s => ({
    icao24: s[0], callsign: s[1], lon: s[5], lat: s[6], baro_altitude: s[7] ? Math.round(s[7] * 3.28084) : null, velocity: s[9], heading: s[10]
  })).filter(a => a.lat && a.lon);
}

async function loadAircraft() {
  const radius = Number(document.getElementById('radius').value);
  setStatus('Loading nearby aircraft...');
  aircraftLayer.clearLayers();
  try {
    let aircraft = [];
    let source = 'ADSB.lol';
    try { aircraft = await fetchAdsbLol(current.lat, current.lon, radius); }
    catch (e) { aircraft = await fetchOpenSky(current.lat, current.lon, radius); source = 'OpenSky'; }
    aircraft.forEach(ac => aircraftLayer.addLayer(planeMarker(ac)));
    countChip.textContent = `Aircraft: ${aircraft.length}`;
    updatedChip.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
    document.getElementById('sourceChip').textContent = `Source: ${source}`;
    setStatus(aircraft.length ? `Loaded ${aircraft.length} aircraft nearby.` : 'No aircraft found nearby right now. Try a larger radius.', aircraft.length ? 'ok' : '');
  } catch (err) {
    console.error(err);
    setStatus('Could not load aircraft data. The free APIs may be rate-limited or temporarily unavailable.', 'error');
  }
}

function useLocation() {
  if (!navigator.geolocation) { setStatus('Location is not supported by this browser.', 'error'); return; }
  setStatus('Getting your location...');
  navigator.geolocation.getCurrentPosition(pos => {
    current = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    map.setView([current.lat, current.lon], 9);
    userMarker.setLatLng([current.lat, current.lon]);
    loadAircraft();
  }, () => { setStatus('Location permission denied. Using Salt Lake City as the default.', 'error'); loadAircraft(); }, { enableHighAccuracy: true, timeout: 10000 });
}

document.getElementById('locBtn').addEventListener('click', useLocation);
document.getElementById('refreshBtn').addEventListener('click', loadAircraft);
document.getElementById('radius').addEventListener('change', loadAircraft);
document.getElementById('autoBtn').addEventListener('click', () => {
  const btn = document.getElementById('autoBtn');
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; btn.textContent = 'Auto Refresh: Off'; }
  else { autoTimer = setInterval(loadAircraft, 30000); btn.textContent = 'Auto Refresh: On'; loadAircraft(); }
});

initMap();
loadAircraft();
window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(), 100));
</script>
</body>
</html>
