<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Flight Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    :root { --bg:#07111f; --panel:#0e1b2e; --panel2:#13233a; --text:#f8fafc; --muted:#a6b4c8; --accent:#38bdf8; --danger:#fb7185; --border:rgba(148,163,184,.22); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    #app { height: 100vh; width: 100vw; display: grid; grid-template-rows: auto 1fr; }
    header { position: relative; z-index: 1000; background: linear-gradient(135deg, rgba(14,27,46,.98), rgba(7,17,31,.94)); border-bottom: 1px solid var(--border); padding: 14px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    .top { display:flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); line-height: 1.1; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    button, select { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 14px; min-height: 46px; }
    button { background: white; color: #06101f; cursor: pointer; }
    button.primary { background: var(--accent); color: #04111f; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    select { background: white; color: #06101f; min-width: 120px; }
    .status { display:flex; gap:8px; flex-wrap:wrap; margin-top: 12px; align-items:center; }
    .pill { background: var(--panel2); border:1px solid var(--border); color: var(--muted); padding: 8px 10px; border-radius: 999px; font-size: 13px; }
    .error { color: var(--danger); font-weight: 700; margin-top: 8px; display:none; }
    #map { height: 100%; width: 100%; background:#0b1220; }
    .leaflet-container { height: 100%; width: 100%; font: inherit; }
    .plane-icon { width: 28px; height: 28px; display:flex; align-items:center; justify-content:center; transform-origin:center; font-size: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.45)); }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #0f172a; color: white; border: 1px solid rgba(148,163,184,.25); }
    .popup-title { font-weight: 800; font-size: 15px; margin-bottom: 4px; }
    .popup-row { color: #cbd5e1; font-size: 13px; margin: 2px 0; }
    @media (max-width: 700px) {
      html, body { overflow: hidden; }
      header { padding: 12px; }
      .top { display:block; }
      .controls { margin-top: 12px; display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
      button, select { width:100%; padding: 10px; min-height: 44px; }
      .subtitle { font-size: 13px; }
      .pill { font-size: 12px; padding: 7px 9px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="top">
        <div>
          <h1>Personal Flight Radar</h1>
          <p class="subtitle">Nearby aircraft using free ADS-B data. For hobby/educational use only.</p>
          <div id="error" class="error"></div>
        </div>
        <div class="controls">
          <button id="locateBtn" class="primary">Use My Location</button>
          <button id="refreshBtn">Refresh</button>
          <button id="autoBtn">Auto Refresh: Off</button>
          <select id="radiusSelect" aria-label="Search radius">
            <option value="25">25 miles</option>
            <option value="50" selected>50 miles</option>
            <option value="100">100 miles</option>
            <option value="150">150 miles</option>
          </select>
        </div>
      </div>
      <div class="status">
        <span class="pill" id="aircraftCount">Aircraft: 0</span>
        <span class="pill" id="updated">Last updated: Never</span>
        <span class="pill" id="source">Source: waiting</span>
      </div>
    </header>
    <main id="map"></main>
  </div>

<script>
const defaultCenter = [40.197, -111.610];
const map = L.map('map', { zoomControl: true }).setView(defaultCenter, 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let userLat = defaultCenter[0];
let userLon = defaultCenter[1];
let userMarker = null;
let aircraftLayer = L.layerGroup().addTo(map);
let autoTimer = null;
let autoOn = false;

const el = id => document.getElementById(id);
const showError = msg => { const e = el('error'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; };
const milesToNm = miles => Math.min(250, Math.max(1, Math.round(miles * 0.868976)));
const fmt = n => (n === undefined || n === null || Number.isNaN(n)) ? 'n/a' : Math.round(n).toLocaleString();
const knotsToMph = k => (k === undefined || k === null) ? null : k * 1.15078;

function setUserMarker(lat, lon) {
  userLat = lat; userLon = lon;
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.circleMarker([lat, lon], { radius: 8, weight: 3, color: '#0284c7', fillColor: '#38bdf8', fillOpacity: .9 }).addTo(map).bindPopup('Your location');
  map.setView([lat, lon], 9);
}

function planeIcon(track) {
  const deg = Number.isFinite(track) ? track : 0;
  return L.divIcon({
    html: `<div class="plane-icon" style="transform: rotate(${deg}deg)">✈️</div>`,
    className: '',
    iconSize: [28,28],
    iconAnchor: [14,14]
  });
}

function normalizeAircraft(list) {
  return (list || []).map(a => ({
    hex: a.hex,
    flight: (a.flight || a.callsign || '').trim(),
    lat: a.lat,
    lon: a.lon,
    alt: a.alt_baro === 'ground' ? 0 : (a.alt_baro ?? a.alt_geom ?? a.baro_altitude),
    speed: a.gs ?? a.velocity,
    track: a.track ?? a.true_heading,
    type: a.t ?? a.type,
    squawk: a.squawk,
    seen: a.seen
  })).filter(a => Number.isFinite(a.lat) && Number.isFinite(a.lon));
}

async function tryFetch(url, sourceName) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`${sourceName} returned ${res.status}`);
  const data = await res.json();
  return { sourceName, aircraft: normalizeAircraft(data.ac || data.aircraft || data.states) };
}

async function loadAircraft() {
  showError('');
  el('refreshBtn').disabled = true;
  el('source').textContent = 'Source: loading...';
  const miles = Number(el('radiusSelect').value);
  const nm = milesToNm(miles);
  const urls = [
    [`https://opendata.adsb.fi/api/v3/lat/${userLat}/lon/${userLon}/dist/${nm}`, 'adsb.fi'],
    [`https://api.airplanes.live/v2/point/${userLat}/${userLon}/${nm}`, 'airplanes.live'],
    [`https://api.adsb.lol/v2/lat/${userLat}/lon/${userLon}/dist/${nm}`, 'ADSB.lol']
  ];
  let lastErr = '';
  for (const [url, name] of urls) {
    try {
      const result = await tryFetch(url, name);
      drawAircraft(result.aircraft);
      el('source').textContent = `Source: ${result.sourceName}`;
      el('updated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
      el('aircraftCount').textContent = `Aircraft: ${result.aircraft.length}`;
      if (!result.aircraft.length) showError('No nearby aircraft found in this radius right now. Try 100 or 150 miles.');
      el('refreshBtn').disabled = false;
      return;
    } catch (err) { lastErr = err.message || String(err); }
  }
  drawAircraft([]);
  el('aircraftCount').textContent = 'Aircraft: 0';
  el('source').textContent = 'Source: unavailable';
  showError('Could not load free ADS-B data. Try Refresh, increase radius, or wait a minute. Last error: ' + lastErr);
  el('refreshBtn').disabled = false;
}

function drawAircraft(aircraft) {
  aircraftLayer.clearLayers();
  for (const a of aircraft) {
    const marker = L.marker([a.lat, a.lon], { icon: planeIcon(a.track) }).addTo(aircraftLayer);
    const name = a.flight || a.hex || 'Unknown aircraft';
    marker.bindPopup(`
      <div class="popup-title">${name}</div>
      <div class="popup-row">Altitude: ${fmt(a.alt)} ft</div>
      <div class="popup-row">Speed: ${fmt(knotsToMph(a.speed))} mph</div>
      <div class="popup-row">Heading: ${fmt(a.track)}°</div>
      <div class="popup-row">Type: ${a.type || 'n/a'}</div>
      <div class="popup-row">Hex: ${a.hex || 'n/a'}</div>
    `);
  }
}

el('locateBtn').addEventListener('click', () => {
  showError('');
  if (!navigator.geolocation) { showError('Your browser does not support location.'); return; }
  el('locateBtn').disabled = true;
  navigator.geolocation.getCurrentPosition(pos => {
    setUserMarker(pos.coords.latitude, pos.coords.longitude);
    el('locateBtn').disabled = false;
    loadAircraft();
  }, err => {
    el('locateBtn').disabled = false;
    showError('Location was blocked or unavailable. Using the default Utah location instead.');
    setUserMarker(userLat, userLon);
    loadAircraft();
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
});

el('refreshBtn').addEventListener('click', loadAircraft);
el('radiusSelect').addEventListener('change', loadAircraft);
el('autoBtn').addEventListener('click', () => {
  autoOn = !autoOn;
  el('autoBtn').textContent = `Auto Refresh: ${autoOn ? 'On' : 'Off'}`;
  if (autoTimer) clearInterval(autoTimer);
  if (autoOn) autoTimer = setInterval(loadAircraft, 30000);
});

setUserMarker(userLat, userLon);
setTimeout(() => map.invalidateSize(), 300);
loadAircraft();
</script>
</body>
</html>
